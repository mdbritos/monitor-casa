<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monitor da Casa</title>
<style>
  :root{--bg:#1e222a;--card:#2e3440;--card2:#3b4252;--txt:#eceff4;--mut:#a7b1c2;--ok:#a3be8c;--warn:#ebcb8b;--bad:#bf616a;--acc:#88c0d0}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px;background:linear-gradient(135deg,#2e3440,#434c5e 50%,#5e81ac)}
  h1{margin:0;font-size:1.35em} .mut{color:var(--mut);font-size:.85em}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  h2{font-size:1em;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .card{background:var(--card);border:1px solid #434c5e;border-radius:14px;padding:14px}
  .card .t{font-weight:700} .card .v{font-size:1.6em;font-weight:800;margin-top:4px}
  .vlan{border-left:6px solid var(--c)} .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--mut)}
  .up{background:var(--ok)} .down{background:var(--bad)}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #3b4252;font-size:.9em} th{color:var(--mut);font-weight:600}
  .vazio{padding:14px;color:var(--mut);background:var(--card);border-radius:14px}
  .al{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--warn)}
  .al.n1{border-left-color:var(--bad)} .al.novo{box-shadow:0 0 0 2px var(--bad)} .tag{font-size:.7em;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bad);color:#fff;margin-left:6px}
  .faixa{display:none;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--bad);font-weight:700}
  button,input{font:inherit;border-radius:10px;border:1px solid #4c566a;background:var(--card2);color:var(--txt);padding:10px 14px}
  button{cursor:pointer;background:var(--acc);color:#1e222a;font-weight:700;border:0}
  #login{max-width:360px;margin:12vh auto;padding:26px;background:var(--card);border-radius:18px;text-align:center}
  #login input{width:100%;margin:14px 0}
  #painel{display:none}
  .uso{background:var(--card);border-radius:14px;margin-bottom:8px;border-left:6px solid var(--c,#88c0d0)}
  .uso summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1.6fr 1fr .8fr 1.4fr;gap:8px;align-items:center;padding:11px 14px}
  .uso summary::-webkit-details-marker{display:none}
  .uso summary .nome{font-weight:700} .uso summary .mb{font-weight:800}
  .uso[open] summary{border-bottom:1px solid #3b4252}
  .uso .det{padding:6px 10px 12px}
  .uso .det table{background:transparent}
  .barra{height:6px;border-radius:99px;background:#3b4252;overflow:hidden;margin-top:3px}
  .barra i{display:block;height:100%;background:var(--acc)}
  .uso-cab{display:grid;grid-template-columns:1.6fr 1fr .8fr 1.4fr;gap:8px;padding:0 14px 6px 20px;color:var(--mut);font-size:.8em;font-weight:600}
  .aviso{font-size:.8em;color:var(--mut);margin:6px 2px 0}
  .grade-uso{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-items:start}
  .grade-uso .uso{margin:0;border-left:0;border-top:5px solid var(--c,#88c0d0);transition:transform .15s,box-shadow .15s}
  .grade-uso .uso:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .grade-uso .uso summary{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:14px;text-align:left}
  .grade-uso .uso .det table th,.grade-uso .uso .det table td{padding:7px 6px;font-size:.84em}
  .grade-uso .uso .det table td:nth-child(n+2){white-space:nowrap}
  @media (max-width:640px){.grade-uso{grid-template-columns:1fr 1fr;gap:10px}.grade-uso .uso summary{padding:11px}.grade-uso .uso .mb{font-size:1.2em}
    .grade-uso .uso .rod{flex-direction:column;gap:2px}.grade-uso .uso .rod .top{max-width:100%}.grade-uso .uso[open]{grid-column:1/-1}}
  .grade-uso .uso .cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grade-uso .uso .mb{font-size:1.5em}
  .grade-uso .uso .rod{display:flex;justify-content:space-between;gap:8px;font-size:.88em}
  .grade-uso .uso .rod .top{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .grade-uso .uso .ver{font-size:.78em;text-align:center;margin-top:2px}
  .grade-uso .uso[open] .ver{visibility:hidden;height:0;margin:0}
  #vpn{overflow-x:auto;border-radius:14px} body{overflow-x:hidden}
  .pastas-acoes{display:flex;gap:8px;justify-content:flex-end;margin:-4px 0 10px}
  button.mini{background:var(--card2);color:var(--txt);font-weight:600;font-size:.82em;padding:6px 12px}
  .pasta{background:var(--card);border-radius:14px;margin-bottom:10px;border-left:6px solid var(--c,#88c0d0)}
  .pasta > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;-webkit-user-select:none;user-select:none}
  .pasta > summary::-webkit-details-marker{display:none}
  .pasta .pico{font-size:1.6em;line-height:1} .pasta .ptit,.pasta .pmb{display:flex;flex-direction:column;gap:2px}
  .pasta .pmb{text-align:right} .pasta .pmb b{font-size:1.15em} .pasta .pon{color:var(--ok);font-weight:700}
  .pasta .pseta{color:var(--mut);transition:transform .2s;font-size:1.1em}
  .pasta[open] .pseta{transform:rotate(90deg)} .pasta[open] > summary{border-bottom:1px solid #3b4252}
  .pasta > .grade-uso{padding:12px}
  @media (max-width:640px){.pasta > summary{grid-template-columns:auto 1fr auto;gap:10px;padding:11px 12px}.pasta .pseta{display:none}.pasta .pmb .mut{display:none}.pasta > .grade-uso{padding:10px}}
  .vpn2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .vpn2 .col{background:var(--card);border-radius:14px;overflow:hidden}
  .vpn2 .col h3{margin:0;padding:11px 14px;font-size:.95em;border-bottom:1px solid #3b4252}
  .vpn2 .col.ent h3{border-top:4px solid var(--ok)} .vpn2 .col.sai h3{border-top:4px solid var(--mut)}
  .vpn2 .ev{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 14px;border-bottom:1px solid #3b4252;font-size:.9em}
  .vpn2 .ev:last-child{border-bottom:0} .vpn2 .ev .q{color:var(--mut);font-size:.85em;white-space:nowrap} .vpn2 .ev b{word-break:break-all}
  .vpn2 .nada{padding:12px 14px;color:var(--mut);font-size:.9em}
  @media (max-width:640px){.vpn2{grid-template-columns:1fr}}
  .uso summary{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .uso summary .info{display:inline-block;margin-left:6px;font-size:.8em;color:var(--mut);border:1px solid #4c566a;border-radius:99px;width:18px;height:18px;text-align:center;line-height:16px}
  #ficha{position:fixed;z-index:50;display:none;width:360px;max-width:calc(100vw - 24px);max-height:80vh;overflow:auto;background:#353c4a;border:1px solid #4c566a;border-left:6px solid var(--c,#88c0d0);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:.9em}
  #ficha.folha{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;max-height:78vh;border-radius:18px 18px 0 0;border-left:0;border-top:6px solid var(--c,#88c0d0);padding-bottom:26px}
  #veu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;display:none}
  #ficha .fx{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #ficha h3{margin:0;font-size:1.15em} #ficha h4{margin:14px 0 6px;font-size:.75em;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  #ficha .pill{display:inline-block;font-size:.78em;font-weight:700;padding:3px 9px;border-radius:99px;background:#3b4252;margin-top:4px}
  #ficha .pill.on{background:rgba(163,190,140,.18);color:var(--ok)}
  #ficha dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0} #ficha dt{color:var(--mut)} #ficha dd{margin:0;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  #ficha .ag{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid #434c5e} #ficha .ag:last-child{border-bottom:0}
  #ficha .chip{font-size:.72em;font-weight:700;padding:1px 7px;border-radius:99px;background:#434c5e;margin-left:6px}
  #ficha .vel{font-weight:800;color:var(--acc)} #ficha .fechar{background:#434c5e;color:var(--txt);padding:4px 10px;font-size:.85em;display:none}
  #ficha.folha .fechar,#ficha.fixa .fechar{display:inline-block}
  #ficha{-webkit-user-select:text;user-select:text;cursor:auto}
  #ficha.fixa{box-shadow:0 0 0 2px var(--acc),0 18px 50px rgba(0,0,0,.55)}
  #ficha .dica{display:none;margin-top:12px;padding-top:8px;border-top:1px dashed #4c566a;font-size:.78em;color:var(--mut);text-align:center}
  body.tem-mouse #ficha:not(.fixa):not(.folha) .dica{display:block}
  #ficha .fixada{display:none;font-size:.72em;font-weight:700;color:var(--acc);margin-left:6px}
  #ficha.fixa .fixada{display:inline}
  #ficha .pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulso 1.4s infinite}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(163,190,140,.7)}70%{box-shadow:0 0 0 8px rgba(163,190,140,0)}100%{box-shadow:0 0 0 0 rgba(163,190,140,0)}}
</style>
</head>
<body>
<div id="login">
  <div style="font-size:48px">🛡️</div>
  <h1>Monitor da Casa</h1>
  <p class="mut">Os dados chegam criptografados. Digite a senha para abrir.</p>
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <label class="mut"><input id="lembrar" type="checkbox" style="width:auto;margin:0 6px 0 0">Lembrar neste aparelho</label><br><br>
  <button onclick="entrar()">Abrir</button>
  <p id="erro" style="color:var(--bad)"></p>
</div>

<div id="painel">
  <header>
    <div><h1>🛡️ Monitor da Casa</h1><div class="mut" id="atual">—</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="ativarAvisos()" id="btnAvisos">🔔 Ativar avisos</button>
      <button onclick="sair()" style="background:var(--card2);color:var(--txt)">Sair</button>
    </div>
  </header>
  <main>
    <div class="faixa" id="faixa"></div>
    <h2>🌐 Internet e pfSense</h2><div class="grid" id="resumo"></div>
    <h2>🗺️ Redes da casa</h2><div class="grid" id="redes"></div>
    <h2>🔐 Conectados na VPN</h2><div id="vpn"></div>
    <h2>👥 Uso por usuário · hoje</h2><div id="uso"></div>
    <h2>🚨 Alertas</h2><div id="alertas"></div>
    <h2>🕒 Entradas e saídas da VPN</h2><div id="eventos"></div>
  </main>
</div>
<div id="veu"></div>
<div id="ficha" role="dialog" aria-live="polite"></div>

<script>
/* ====== CONFIGURE AQUI ====== */
const GIST_ID = "fdbe72018cc9cf1c7e7fd70db45fb997";
const GIST_DONO = "mdbritos";    // usuário do GitHub dono do gist
const INTERVALO_S = 60;          // lê o arquivo direto do gist (sem o limite de 60/hora da API)
/* ============================ */

const CORES = {GERENCIA:"#f59e0b",CABEADA:"#22c55e",WIFI:"#06b6d4",GAMES:"#a855f7",IOT:"#eab308",
  SERVIDORES:"#3b82f6",CONVIDADOS:"#ec4899",EMPRESA:"#ef4444",WAN:"#94a3b8"};
let SENHA = null, timer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
            set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function decifrar(p, senha){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const txt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, chave, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(txt));
}

async function buscar(){
  // 1º: arquivo direto do gist (sem limite de leituras). 2º: API do GitHub (limite de 60/hora), só se o 1º falhar.
  let conteudo = null;
  try{
    const r = await fetch(`https://gist.githubusercontent.com/${GIST_DONO}/${GIST_ID}/raw/monitor.json?t=${Date.now()}`, {cache:"no-store"});
    if(r.ok) conteudo = await r.text();
  }catch(e){ console.warn("raw falhou", e); }
  if(conteudo === null){
    const r = await fetch("https://api.github.com/gists/" + GIST_ID, {cache:"no-store"});
    if(r.status === 403 || r.status === 429) throw new Error("o GitHub limitou as leituras por agora. Tente de novo em alguns minutos.");
    if(!r.ok) throw new Error("GitHub respondeu " + r.status);
    const f = (await r.json()).files["monitor.json"];
    conteudo = f.truncated ? await (await fetch(f.raw_url, {cache:"no-store"})).text() : f.content;
  }
  return decifrar(JSON.parse(conteudo), SENHA);
}

async function entrar(){
  $("erro").textContent = "";
  SENHA = $("senha").value || ls.get("monitor_senha");
  try{
    const d = await buscar();
    if($("lembrar").checked) ls.set("monitor_senha", SENHA);
    $("login").style.display = "none"; $("painel").style.display = "block";
    desenhar(d); clearInterval(timer); timer = setInterval(atualizar, INTERVALO_S*1000);
  }catch(e){ $("erro").textContent = e.name === "OperationError" ? "Senha errada." : ("Erro: " + e.message); }
}
async function atualizar(){ try{ desenhar(await buscar()); }catch(e){ console.warn(e); } }
function sair(){ ls.del("monitor_senha"); location.reload(); }

function tempoDesde(iso){
  const s = Math.round((Date.now() - new Date(iso))/1000);
  return s < 60 ? s + " s" : s < 3600 ? Math.round(s/60) + " min" : Math.round(s/3600) + " h";
}

function avisar(titulo, corpo){
  try{ if(Notification.permission === "granted") new Notification(titulo, {body:corpo}); }catch(e){}
  try{ const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination);
       o.start(); setTimeout(() => {o.stop(); a.close();}, 250); }catch(e){}
}
async function ativarAvisos(){
  try{ const p = await Notification.requestPermission(); $("btnAvisos").textContent = p === "granted" ? "🔔 Avisos ligados" : "🔕 Avisos bloqueados"; }catch(e){}
}

const mb = b => { const m = (b || 0) / 1048576; return m >= 1024 ? (m/1024).toFixed(2) + " GB" : (m >= 10 ? m.toFixed(0) : m.toFixed(1)) + " MB"; };
const tempo = min => { min = Math.round(min || 0); return min < 60 ? min + " min" : Math.floor(min/60) + "h " + String(min%60).padStart(2,"0"); };
let abertos = new Set();
let HOSTS = {}, GERADO = null, fichaIp = null;
const vel = bps => { bps = bps || 0; return bps >= 1e6 ? (bps/1e6).toFixed(1) + " Mbps" : Math.max(1, Math.round(bps/1e3)) + " kbps"; };
const hora = iso => iso ? new Date(iso).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "—";
const linha = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";

function fichaHTML(h){
  const on = h.ultimo && GERADO && (new Date(GERADO) - new Date(h.ultimo)) < 180000;
  const v = h.vpn, ag = [...(h.agora || [])].sort((a, b) => (b.bps || 0) - (a.bps || 0)), maxAg = Math.max(...ag.map(a => a.bps || 0), 1);
  return `<div class="fx"><div><h3>${esc(h.nome || h.ip)}</h3>
      <span class="pill ${on ? "on" : ""}">${on ? '<span class="pulso"></span>Online agora' : "⚪ Visto por último às " + hora(h.ultimo)}</span></div>
      <span><span class="fixada">📌 fixada</span> <button class="fechar" onclick="fecharFicha()" title="Fechar (Esc)">✕</button></span></div>
    <h4>🪪 Identificação</h4><dl>
      ${linha("IP", h.ip)}${linha("MAC", h.mac || "—")}${linha("Fabricante", h.fabricante || "—")}
      ${linha("Nome na rede", h.nome_rede || "—")}${linha("Sistema", h.sistema)}${linha("Rede", h.rede)}
    </dl>
    ${v ? `<h4>🔐 VPN</h4><dl>${linha("Usuário", v.usuario)}${linha("Conectou de", v.origem)}${linha("Desde", v.desde)}
      ${linha("Recebido", mb(v.recebido))}${linha("Enviado", mb(v.enviado))}</dl>` : ""}
    <h4>📡 Acessando agora</h4>
    ${ag.length ? ag.map(a => `<div class="ag"><span>${esc(a.dominio)}${a.app ? `<span class="chip">${esc(a.app)}</span>` : ""}
        <div class="barra"><i style="width:${Math.max(3, 100*(a.bps||0)/maxAg)}%"></i></div></span><span class="vel">${vel(a.bps)}</span></div>`).join("")
      : '<div class="mut">Nada no último minuto.</div>'}
    <h4>📅 Hoje</h4><dl>
      ${linha("Gasto", mb(h.bytes))}${linha("Tempo online", tempo(h.minutos))}
      ${linha("Primeiro uso", hora(h.primeiro))}${linha("Última atividade", hora(h.ultimo))}
    </dl>
    ${(h.sites || []).length ? `<h4>🏆 Mais usados hoje</h4>` + h.sites.slice(0,3).map((s, i) =>
      `<div class="ag"><span>${["🥇","🥈","🥉"][i]} ${esc(s.dominio)}</span><span class="mut">${mb(s.bytes)} · ${tempo(s.minutos)}</span></div>`).join("") : ""}
    <div class="dica">🖱️ Segure o clique sobre o usuário para <b>fixar</b> esta ficha e copiar as informações</div>`;
}
function mostrarFicha(ip, x, y, folha){
  const h = HOSTS[ip]; if(!h) return;
  const f = $("ficha"); fichaIp = ip;
  f.style.setProperty("--c", CORES[String(h.rede || "").toUpperCase()] || "#88c0d0");
  f.innerHTML = fichaHTML(h); f.classList.toggle("folha", !!folha); f.style.display = "block";
  $("veu").style.display = folha ? "block" : "none";
  if(!folha) posicionar(x, y);
}
function posicionar(x, y){
  const f = $("ficha"), w = f.offsetWidth, hh = f.offsetHeight, m = 14;
  let l = x + 18, t = y + 14;
  if(l + w > innerWidth - m) l = Math.max(m, x - w - 18);
  if(t + hh > innerHeight - m) t = Math.max(m, innerHeight - hh - m);
  f.style.left = l + "px"; f.style.top = t + "px";
}
let fichaFixa = false;
function fecharFicha(){ const f = $("ficha"); f.style.display = "none"; f.classList.remove("fixa"); $("veu").style.display = "none"; fichaIp = null; fichaFixa = false; }

(function ligarFicha(){
  const uso = document.getElementById("uso"), mouse = matchMedia("(hover:hover) and (pointer:fine)").matches;
  let tempoHover = null, tempoToque = null, tempoFixar = null, segurou = false, x0 = 0, y0 = 0;
  const alvo = e => e.target.closest && e.target.closest("details.uso > summary");
  if(mouse){
    document.body.classList.add("tem-mouse");
    uso.addEventListener("mouseover", e => { if(fichaFixa) return; const s = alvo(e); if(!s) return;
      clearTimeout(tempoHover); const ip = s.parentElement.dataset.ip;
      tempoHover = setTimeout(() => { if(!fichaFixa) mostrarFicha(ip, e.clientX, e.clientY, false); }, 250); });
    uso.addEventListener("mousemove", e => { if(fichaIp && !fichaFixa && alvo(e)) posicionar(e.clientX, e.clientY); });
    uso.addEventListener("mouseout", e => { if(fichaFixa) return; const s = alvo(e); if(!s || s.contains(e.relatedTarget)) return;
      clearTimeout(tempoHover); fecharFicha(); });
    // segurar o clique ~0,4 s no usuário = fixar a ficha (para de seguir o mouse e dá para copiar)
    uso.addEventListener("mousedown", e => { const s = alvo(e); if(!s || e.button !== 0) return;
      clearTimeout(tempoFixar); const ip = s.parentElement.dataset.ip, x = e.clientX, y = e.clientY;
      tempoFixar = setTimeout(() => {
        segurou = true; clearTimeout(tempoHover);
        if(fichaIp !== ip) mostrarFicha(ip, x, y, false);
        fichaFixa = true; $("ficha").classList.add("fixa");
      }, 400); });
    document.addEventListener("mouseup", () => clearTimeout(tempoFixar));
    // com a ficha fixa: clicar fora (ou Esc, ou ✕) fecha
    document.addEventListener("mousedown", e => {
      if(fichaFixa && !e.target.closest("#ficha") && !(alvo(e) && alvo(e).parentElement.dataset.ip === fichaIp)) fecharFicha(); });
  }
  uso.addEventListener("touchstart", e => { const s = alvo(e); if(!s) return;
    segurou = false; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    tempoToque = setTimeout(() => { segurou = true; if(navigator.vibrate) navigator.vibrate(30);
      mostrarFicha(s.parentElement.dataset.ip, 0, 0, true); }, 500); }, {passive:true});
  uso.addEventListener("touchmove", e => { if(Math.hypot(e.touches[0].clientX - x0, e.touches[0].clientY - y0) > 10) clearTimeout(tempoToque); }, {passive:true});
  uso.addEventListener("touchend", e => { clearTimeout(tempoToque); if(segurou){ e.preventDefault(); } });
  uso.addEventListener("click", e => { if(segurou && alvo(e)){ e.preventDefault(); segurou = false; } }, true);
  uso.addEventListener("contextmenu", e => { if(alvo(e)) e.preventDefault(); });
  $("veu").addEventListener("click", fecharFicha);
  document.addEventListener("keydown", e => { if(e.key === "Escape") fecharFicha(); });
})();

const PASTAS = {
  CABEADA:["🖥️","Cabeada"], WIFI:["📶","Wi-Fi"], GAMES:["🎮","Games"], VPN:["🔐","VPN"], EMPRESA:["🏢","Empresa"],
  CONVIDADOS:["👋","Convidados"], SERVIDORES:["🗄️","Servidores"], IOT:["💡","IoT · casa inteligente"], GERENCIA:["🔧","Gerência"]};
const ORDEM = ["CABEADA","WIFI","GAMES","VPN","EMPRESA","CONVIDADOS","SERVIDORES","GERENCIA","IOT"];
let pastasAbertas = new Set(JSON.parse(ls.get("monitor_pastas") || "[]"));
function salvarPastas(){ ls.set("monitor_pastas", JSON.stringify([...pastasAbertas])); }

function cartaoUso(h, maior){
  const cor = CORES[String(h.rede || "").toUpperCase()] || "#88c0d0", top = (h.sites || [])[0];
  const maiorSite = Math.max(...(h.sites || []).map(s => s.bytes || 0), 1);
  return `<details class="uso" style="--c:${cor}" data-ip="${esc(h.ip)}" ${abertos.has(h.ip) ? "open" : ""}>
    <summary>
      <div class="cab"><span class="nome">${esc(h.nome || h.ip)}</span><span class="info" title="Ficha do usuário">i</span></div>
      <div class="mut">${esc(h.rede || "")} · ${esc(h.ip)}</div>
      <div><span class="mb">${mb(h.bytes)}</span> <span class="mut">hoje</span><div class="barra"><i style="width:${Math.max(2, 100*(h.bytes||0)/maior)}%"></i></div></div>
      <div class="rod"><span>⏱️ ${tempo(h.minutos)}</span><span class="top">🏆 ${top ? esc(top.dominio) : "—"}</span></div>
      <div class="ver mut">▾ ver sites</div>
    </summary>
    <div class="det">${(h.sites || []).length ? `<table><tr><th>Site</th><th>Gasto</th><th>Tempo</th></tr>${
      h.sites.map(s => `<tr><td>${esc(s.dominio)}<div class="barra"><i style="width:${Math.max(2, 100*(s.bytes||0)/maiorSite)}%"></i></div></td><td>${mb(s.bytes)}</td><td>${tempo(s.minutos)}</td></tr>`).join("")}</table>`
      : '<div class="mut">Nenhum site registrado.</div>'}</div>
  </details>`;
}

function desenharUso(u){
  const el = $("uso");
  HOSTS = {}; ((u && u.hosts) || []).forEach(h => HOSTS[h.ip] = h);
  if(fichaIp && HOSTS[fichaIp] && !fichaFixa) $("ficha").innerHTML = fichaHTML(HOSTS[fichaIp]); // fixa: não mexe (não perde a seleção)
  el.querySelectorAll("details.uso[open]").forEach(x => abertos.add(x.dataset.ip));
  el.querySelectorAll("details.uso:not([open])").forEach(x => abertos.delete(x.dataset.ip));
  const hosts = (u && u.hosts) || [];
  if(!hosts.length){ el.innerHTML = '<div class="vazio">Sem dados de uso ainda (precisa do ntopng no pfSense).</div>'; return; }
  const maior = Math.max(...hosts.map(h => h.bytes || 0), 1);

  // monta as pastas: a do apelidos.txt (Nome|Pasta) ou a rede (VLAN)
  const grupos = {};
  hosts.forEach(h => { const k = (h.grupo || "").trim() ? "G:" + h.grupo.trim() : "R:" + String(h.rede || "OUTROS").toUpperCase();
    (grupos[k] = grupos[k] || []).push(h); });
  const peso = k => k.startsWith("G:") ? -1 : (ORDEM.indexOf(k.slice(2)) + 1 || 99);
  const chaves = Object.keys(grupos).sort((a, b) => peso(a) - peso(b) || a.localeCompare(b));
  const online = h => h.ultimo && GERADO && (new Date(GERADO) - new Date(h.ultimo)) < 180000;

  el.innerHTML = `<div class="pastas-acoes"><button class="mini" onclick="todasPastas(true)">📂 Abrir todas</button><button class="mini" onclick="todasPastas(false)">📁 Fechar todas</button></div>` +
    chaves.map(k => {
      const lista = grupos[k], custom = k.startsWith("G:"), nome = k.slice(2);
      const [ico, titulo] = custom ? ["📁", nome] : (PASTAS[nome] || ["📁", nome]);
      const cor = custom ? "#88c0d0" : (CORES[nome] || "#88c0d0");
      const total = lista.reduce((t, h) => t + (h.bytes || 0), 0), on = lista.filter(online).length;
      const maiorUso = lista[0];
      return `<details class="pasta" data-pasta="${esc(k)}" style="--c:${cor}" ${pastasAbertas.has(k) ? "open" : ""}>
        <summary>
          <span class="pico">${ico}</span>
          <span class="ptit"><b>${esc(titulo)}</b><span class="mut">${lista.length} ${lista.length === 1 ? "aparelho" : "aparelhos"} · ${on ? `<span class="pon">● ${on} online</span>` : "ninguém online"}</span></span>
          <span class="pmb"><b>${mb(total)}</b><span class="mut">mais uso: ${esc(maiorUso.nome || maiorUso.ip)}</span></span>
          <span class="pseta">▸</span>
        </summary>
        <div class="grade-uso">${lista.map(h => cartaoUso(h, maior)).join("")}</div>
      </details>`;
    }).join("") +
    `<p class="aviso">Clique numa pasta para abrir. Passe o mouse (no PC) ou segure o dedo (no celular) sobre um usuário para ver a ficha dele; clique nele para ver a lista de sites. Valores de hoje desde ${esc(u.desde || "00:00")}. Tempo = minutos com tráfego para o site (estimativa). Em sites com HTTPS aparece só o domínio, nunca a página.</p>`;

  el.querySelectorAll("details.pasta").forEach(d => d.addEventListener("toggle", () => {
    d.open ? pastasAbertas.add(d.dataset.pasta) : pastasAbertas.delete(d.dataset.pasta); salvarPastas(); }));
}
function todasPastas(abrir){
  document.querySelectorAll("#uso details.pasta").forEach(d => { d.open = abrir; abrir ? pastasAbertas.add(d.dataset.pasta) : pastasAbertas.delete(d.dataset.pasta); });
  salvarPastas();
}

function desenhar(d){
  GERADO = d.gerado;
  const idade = (Date.now() - new Date(d.gerado))/1000;
  $("atual").textContent = "Atualizado há " + tempoDesde(d.gerado) + " · renova a cada " + INTERVALO_S + " s";
  const f = $("faixa");
  f.style.display = idade > 300 ? "block" : "none";
  f.textContent = "⚠️ O coletor não envia dados há " + tempoDesde(d.gerado) + ". Confira o container monitor.";

  const r = d.rede || {}, wan = (r.gateways || [])[0] || {};
  const online = /online|none/i.test(wan.status || "");
  $("resumo").innerHTML = [
    ["🌍 Internet", online ? "Online" : (wan.status || "?"), online ? "up" : "down"],
    ["⏱️ Latência", wan.atraso || "—"], ["📉 Perda", wan.perda || "—"],
    ["🧠 CPU", r.cpu != null ? r.cpu + "%" : "—"], ["💾 Memória", r.memoria != null ? r.memoria + "%" : "—"],
    ["🔐 Na VPN", (d.vpn || []).length]
  ].map(([t,v,s]) => `<div class="card"><div class="t">${s?`<span class="dot ${s}"></span>`:""}${esc(t)}</div><div class="v">${esc(v)}</div></div>`).join("");

  $("redes").innerHTML = (r.redes || []).map(n => {
    const nome = String(n.nome).toUpperCase(), cor = CORES[nome] || "#88c0d0", up = /up|associated/i.test(n.status);
    return `<div class="card vlan" style="--c:${cor}"><div class="t"><span class="dot ${up?"up":"down"}"></span>${esc(n.nome)}</div>
            <div class="mut">${esc(n.ip || "")}</div></div>`;
  }).join("") || '<div class="vazio">Sem dados das redes.</div>';

  const vpn = d.vpn || [];
  $("vpn").innerHTML = vpn.length ? `<table><tr><th>Usuário</th><th>De onde</th><th>IP na VPN</th><th>Desde</th></tr>${
    vpn.map(u => `<tr><td>${esc(u.usuario)}</td><td>${esc(u.origem)}</td><td>${esc(u.ip_vpn)}</td><td>${esc(u.desde)}</td></tr>`).join("")}</table>`
    : '<div class="vazio">Ninguém conectado agora.</div>';

  desenharUso(d.uso);

  const vistos = new Set(JSON.parse(ls.get("monitor_vistos") || "[]")), primeira = !ls.get("monitor_vistos");
  const al = d.alertas || [];
  $("alertas").innerHTML = al.length ? al.map(a => {
    const novo = !vistos.has(a.id);
    if(novo && !primeira) avisar(a.tipo === "ataque" ? "🚨 Ataque detectado" : "⚠️ Tentativa de login", a.mensagem);
    return `<div class="al n${a.nivel} ${novo && !primeira ? "novo" : ""}"><div>${a.tipo === "ataque" ? "🚨" : "⚠️"}</div>
      <div><b>${esc(a.mensagem)}</b>${novo && !primeira ? '<span class="tag">NOVO</span>' : ""}
      <div class="mut">${esc(a.quando)} · ${esc(a.origem)} → ${esc(a.destino)} · nível ${esc(a.nivel)}</div></div></div>`;
  }).join("") : '<div class="vazio">Nenhum alerta. 🎉</div>';

  const ev = d.eventos || [];
  ev.forEach(e => { const k = "ev:" + e.quando + e.usuario; if(!vistos.has(k) && !primeira) avisar("🔐 VPN", e.usuario + (e.tipo === "vpn-entrou" ? " conectou" : " desconectou")); vistos.add(k); });
  al.forEach(a => vistos.add(a.id));
  ls.set("monitor_vistos", JSON.stringify([...vistos].slice(-800)));
  const coluna = (titulo, classe, lista) => `<div class="col ${classe}"><h3>${titulo} <span class="mut">(${lista.length})</span></h3>${
    lista.length ? lista.slice(0, 15).map(e => `<div class="ev"><span class="q">${esc(new Date(e.quando).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}))}<br>${esc(new Date(e.quando).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}))}</span>
      <span><b>${esc(e.usuario)}</b><div class="mut">${e.origem ? "de " + esc(e.origem) : ""}</div></span></div>`).join("")
    : '<div class="nada">Nenhuma registrada.</div>'}</div>`;
  $("eventos").innerHTML = `<div class="vpn2">${coluna("🟢 Entradas", "ent", ev.filter(e => e.tipo === "vpn-entrou"))}${coluna("⚪ Saídas", "sai", ev.filter(e => e.tipo !== "vpn-entrou"))}</div>`;
}

if(ls.get("monitor_senha")){ $("lembrar").checked = true; entrar(); }
$("senha").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
</script>
